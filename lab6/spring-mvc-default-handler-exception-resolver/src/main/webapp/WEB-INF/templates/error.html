<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Error</title>
</head>
<body>
    <h1>Error Occurred</h1>
    <p>An error occurred while processing your request.</p>
    <p th:if="${exception}" th:text="'Exception: ' + ${exception}"></p>
</body>
</html>
